# ============================================================================
# infra-agent doctor 配置文件示例
#
# 用法：
#   infra-agent doctor --config ~/.infra-agent.yaml --host 10.0.0.1
#   或把本文件复制为 ~/.infra-agent.yaml（默认会自动读取）
#
# 优先级：命令行参数 > 本文件 > 内置默认值
# 因此本文件里的值都可以被命令行临时覆盖，
# 例如 `--max-rounds 40` 会盖掉这里的 loop.max_rounds。
# ============================================================================

doctor:
  # --------------------------------------------------------------------------
  # SSH 接入
  # --------------------------------------------------------------------------
  ssh:
    # 首节点端口
    port: 22
    # 登录用户
    user: root

    # 认证方式二选一，私钥优先。
    # 支持 ~ 展开，但不要把生产私钥提交进版本库。
    private_key: ~/.ssh/id_rsa
    # password: ""

    # 提供后即启用严格的主机键校验（推荐）。
    # 留空则退回 TOFU，并在报告里标注"本次连接未校验主机身份"。
    known_hosts: ~/.ssh/known_hosts

    # 诊断命令超时（秒）。
    # 故障集群的 ceph -s 可能卡住，不要设得太短；
    # 超时本身会被当作"mon 无响应"这类证据记录。
    command_timeout: 30

    # 能力探测与拓扑发现的单条命令超时（秒）。
    # 这些命令本该秒回，设短一点可以让不可达的探测快速失败。
    probe_timeout: 8

  # --------------------------------------------------------------------------
  # 模型（OpenAI 兼容接口）
  # --------------------------------------------------------------------------
  llm:
    # 模型名。中转站通常要写它自己的模型别名。
    model: deepseek-v4.1-flash

    # 接口地址。留空则用 OpenAI 官方；用中转站时填中转地址。
    # 注意 base_url 不需要带 /chat/completions，程序会自己拼。
    base_url: "https://token-wormhole.deeproute.cn"

    # API Key 的两种来源，二选一：
    #   1) 本字段直接写（不建议，配置文件容易被提交）
    #   2) 留空，改用下面的环境变量名
    api_key: "sk-cdaeb2c70a154748ca619415d9864ff07f4aeccd98deb8a4451b3bd956024fb7"
    api_key_env: OPENAI_API_KEY

    # 采样温度。诊断场景建议 0~0.3，越低结论越稳定。
    temperature: 0.2

    # 单次模型回复的最大 token 数。
    #
    # 这是"模型这一次说多少话"的上限，不是上下文窗口：
    # 工具输出再长也由上下文压缩控制，与本项无关。
    #
    # 设为 0 表示不发送该字段，交给服务端决定。多数中转站/vLLM 的
    # 默认值很小（16~256），容易把结论 JSON 截断，因此不建议设 0。
    # 被截断时程序会识别 finish_reason=length 并要求模型精简重试，
    # 但反复截断会白白消耗轮次预算。
    max_tokens: 8192

    # 单次请求超时（秒）。长上下文 + 工具调用可能比较慢。
    timeout: 300

    # 失败重试次数。
    # -1 = 使用内置默认值（2 次）
    #  0 = 不重试
    # 遇到 429 / 5xx 会自动重试，4xx 不重试。
    max_retries: -1

  # --------------------------------------------------------------------------
  # 调查循环预算
  # --------------------------------------------------------------------------
  loop:
    # 最大调查轮数。一轮 = 一次模型调用。
    # 体检通常 3-5 轮；复杂性能问题 10-20 轮。
    max_rounds: 20

    # 工具调用总次数上限。防止模型反复查询把成本拉高。
    max_tool_calls: 60

    # 单个工具的最大调用次数，防止死磕同一个工具。
    max_per_tool: 5

  # --------------------------------------------------------------------------
  # Ceph 相关
  # --------------------------------------------------------------------------
  ceph:
    # 本地 Ceph 源码目录，供 ceph_source_lookup 工具使用。
    # 指向按版本分目录的内网源码镜像，例如：
    #   /data/ceph-src/
    #     v18.2.4/
    #     v16.2.14/
    # 留空则该工具不可用（不会影响其余诊断）。
    source_dir: ""

  # --------------------------------------------------------------------------
  # 报告
  # --------------------------------------------------------------------------
  report:
    # text  = 完整报告（结论 + 证据表 + 建议 + 未能确定）
    # brief = 值班视角，十行以内
    # json  = 机器可读，供下游系统消费
    format: text

  # --------------------------------------------------------------------------
  # 运行行为
  # --------------------------------------------------------------------------
  # 总超时（秒），覆盖连接、快照、全部调查轮次与报告生成
  timeout: 600

  # 仅连接并探测能力与拓扑，不调用模型（不消耗 token）
  dry_run: false

  # 在真实集群上逐个运行诊断工具，验证解析是否正确（不调用模型）
  self_check: false

  # 诊断结束后进入交互模式，可以继续追问
  interactive: false


# ============================================================================
# 下面是其它命令（analyze / patrol）的配置，保持原样即可
# ============================================================================

# Kubernetes 配置
kubernetes:
  kubeconfig: ""
  namespace: ""
  timeout: 30

# AI 配置（analyze 命令使用，与上面的 doctor.llm 相互独立）
ai:
  provider: "openai"
  enabled: true
  anonymize: true

  openai:
    apiKey: "${OPENAI_API_KEY}"
    model: "gpt-4"
    baseURL: "https://api.openai.com/v1"
    temperature: 0.7
    maxTokens: 2000

  anthropic:
    apiKey: "${ANTHROPIC_API_KEY}"
    model: "claude-3-sonnet-20240229"
    baseURL: "https://api.anthropic.com"
    maxTokens: 2000

# 通知配置
notifiers:
  default: "feishu"
  feishu:
    enabled: true
    webhookURL: "${FEISHU_WEBHOOK_URL}"
    secret: "${FEISHU_SECRET}"

# 巡检配置
patrol:
  enabled: false
  interval: 30
